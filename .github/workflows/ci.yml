name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - name: HTTP, MCP, enrichment and Suzaku contracts
        run: |
          mkdir -p test-results
          set -o pipefail
          uv run --locked python -m unittest discover -s tests -v 2>&1 | tee test-results/contracts.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Browser smoke and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --locked
      - run: node --check src/kamotrace/static/app.js
      - run: uv build
      - run: git diff --check
      - name: Install test-only Chromium
        run: uv run --locked --with playwright==1.58.0 python -m playwright install --with-deps chromium
      - name: Verify rendered events and search; capture screenshots
        run: |
          mkdir -p test-results
          set -o pipefail
          uv run --locked --with playwright==1.58.0 python tests/browser_smoke.py 2>&1 | tee test-results/browser.log
      - name: Build Docker image
        run: docker build -t kamotrace:ci .
      - uses: actions/upload-artifact@v4
        id: browser-results
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Link visual test results
        if: always()
        env:
          RESULTS_URL: ${{ steps.browser-results.outputs.artifact-url }}
        run: |
          {
            echo '## Browser smoke test'
            echo 'Real Chromium, real local HTTP server, disposable synthetic CloudTrail evidence.'
            echo 'Checks five loaded events, then searches for SendCommand and verifies exactly three matching rows.'
            echo "[Download screenshots, browser log and Playwright trace]($RESULTS_URL)"
            echo 'Screenshots: events.png and search.png. On browser failures, also inspect failure.png and trace.zip.'
          } >> "$GITHUB_STEP_SUMMARY"
